name: Build Docs

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build docs
        run: doxygen Doxyfile

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: html
