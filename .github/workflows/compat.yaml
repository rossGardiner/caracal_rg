name: Cross-platform build and test

on:
  push:
    branches: [dev, test]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    env:
      PYTHONPATH: ${{ github.workspace }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0

      - name: Install Python dependencies
        run: |
          python -m pip install git+https://github.com/acmarkham/caracal-python.git
          python -m pip install -r requirements.txt

      - name: Import smoke test
        run: |
          python test/import_smoke.py
      
      - name: Run unit tests
        run: python -m pytest test

